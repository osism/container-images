---
name: Build openstackclient container image

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - .github/workflows/build-openstackclient-container-image.yml
      - openstackclient/**
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/build-openstackclient-container-image.yml
      - openstackclient/**

jobs:

  build-openstackclient-container-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Mark the rolling series (built from OpenStack master) with
        # rolling: "true". It is the single source of truth: it selects the
        # master requirements in the build (ROLLING build-arg) and publishes the
        # image as :latest (PUBLISH_LATEST). Move this flag when the rolling
        # series advances (e.g. to a future 2026.2 entry).
        include:
          - version: "2025.1"
          - version: "2025.2"
          - version: "2026.1"
            rolling: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Setup docker
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.ref == 'refs/heads/main'

      - name: Build container image
        run: scripts/build.sh
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE: openstackclient
          REPOSITORY: osism/openstackclient
          VERSION: ${{ matrix.version }}
          ROLLING: ${{ matrix.rolling }}

      - name: Push container image
        run: |
          scripts/push.sh
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_SERVER: ${{ secrets.DTRACK_SERVER }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: openstackclient
          REPOSITORY: osism/openstackclient
          VERSION: ${{ matrix.version }}
          PUBLISH_LATEST: ${{ matrix.rolling }}
        if: |
          github.repository == 'osism/container-images' &&
          github.ref == 'refs/heads/main'
